<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>J_Sys Lucky Draw</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">J_Sys</p>
          <h1>多场活动扫码抽奖系统</h1>
        </div>
        <div class="topbar-actions hidden">
          <span id="sessionLabel" class="session-label">未登录</span>
          <button id="logoutButton" class="secondary hidden" type="button">退出</button>
        </div>
      </header>

      <section id="joinView" class="panel narrow hidden"></section>
      <section id="resultView" class="panel narrow hidden"></section>
      <section id="screenView" class="screen-view hidden"></section>

      <section id="loginView" class="panel narrow hidden">
        <h2>管理员登录 / Admin Login</h2>
        <form id="loginForm" class="form-grid">
          <label>
            账号 / Username
            <input name="username" autocomplete="username" value="admin" required />
          </label>
          <label>
            密码 / Password
            <input name="password" type="password" autocomplete="current-password" value="admin123" required />
          </label>
          <button type="submit">登录 / Login</button>
        </form>
        <p id="loginMessage" class="message"></p>
      </section>

      <section id="adminView" class="hidden">
        <div class="layout">
          <section class="panel list-panel">
            <div class="section-head">
              <div>
                <h2>活动管理 / Events</h2>
                <p>创建活动后会生成报名链接和二维码目标地址。</p>
              </div>
              <button id="newEventButton" type="button">新建活动</button>
            </div>
            <div id="eventList" class="event-list"></div>
          </section>

          <section class="panel form-panel">
            <div class="section-head">
              <div>
                <h2 id="formTitle">新建活动 / New Event</h2>
                <p>中英文文案可直接写在同一个输入框里。</p>
              </div>
            </div>

            <form id="eventForm" class="form-grid">
              <input type="hidden" name="id" />
              <input type="hidden" name="questionsConfig" />
              <label>
                活动标题 / Event Title
                <input name="title" required />
              </label>
              <label>
                满意度问题 / Satisfaction Question
                <input name="satisfactionQuestion" required />
              </label>
              <label>
                单选题问题 / Single-choice Question
                <input name="topicQuestion" required />
              </label>
              <label>
                单选题选项 / Single-choice Options
                <textarea name="topicOptions" rows="8" required></textarea>
              </label>
              <label>
                问答题文案 / Free-text Question
                <input name="freeTextQuestion" required />
              </label>
              <section class="question-builder">
                <div class="builder-head">
                  <div>
                    <h3>报名问题配置 / Registration Questions</h3>
                    <p>每个活动可以配置不同问题，支持单选、多选、问答和评分。</p>
                  </div>
                  <button id="addQuestionButton" type="button" class="secondary">添加问题 / Add</button>
                </div>
                <div id="questionList" class="question-list"></div>
              </section>
              <label>
                隐私说明 / Privacy Notice
                <textarea name="privacyNotice" rows="4" required></textarea>
              </label>
              <div class="split">
                <label>
                  中奖人数 / Winners
                  <input name="winningCount" type="number" min="1" value="1" required />
                </label>
                <label>
                  状态 / Status
                  <select name="status">
                    <option value="active">active</option>
                    <option value="draft">draft</option>
                    <option value="closed">closed</option>
                  </select>
                </label>
              </div>
              <div class="form-actions">
                <button type="submit">保存活动 / Save</button>
                <button id="resetFormButton" class="secondary" type="button">清空 / Reset</button>
              </div>
            </form>
            <p id="eventMessage" class="message"></p>
          </section>
        </div>
      </section>
    </main>

    <script src="/main.js"></script>
  </body>
</html>
